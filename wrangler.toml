# Cloudflare Workers static-assets site (no Worker script needed).
# Build: `npm run build`, deploy: `npx wrangler deploy` (Workers Builds runs this automatically).
name = "reaction-info"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Required by `wrangler preview`, which Workers Builds runs for non-production
# branches (pull requests). Empty: assets and settings above are inherited.
[previews]
