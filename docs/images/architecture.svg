<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif">
    <!-- Browser -->
    <rect x="32" y="32" width="430" height="366" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="52" y="64" font-size="17" font-weight="700" fill="#1e3a8a">浏览器 · React 单页应用</text>
    <text x="52" y="86" font-size="12" fill="#3b82f6">src/ · Vite 构建 → dist/</text>
    <g font-size="13" fill="#0f172a">
      <rect x="52" y="104" width="190" height="56" rx="10" fill="#fff" stroke="#bfdbfe"/>
      <text x="66" y="128" font-weight="700">投料计算引擎</text><text x="66" y="148" font-size="11.5" fill="#64748b">chem/stoich.ts · 纯函数</text>
      <rect x="252" y="104" width="190" height="56" rx="10" fill="#fff" stroke="#bfdbfe"/>
      <text x="266" y="128" font-weight="700">RDKit (WASM)</text><text x="266" y="148" font-size="11.5" fill="#64748b">结构式绘制 · 分子式</text>
      <rect x="52" y="170" width="190" height="56" rx="10" fill="#fff" stroke="#bfdbfe"/>
      <text x="66" y="194" font-weight="700">Ketcher</text><text x="66" y="214" font-size="11.5" fill="#64748b">画结构 · 懒加载</text>
      <rect x="252" y="170" width="190" height="56" rx="10" fill="#fff" stroke="#bfdbfe"/>
      <text x="266" y="194" font-weight="700">Tiptap</text><text x="266" y="214" font-size="11.5" fill="#64748b">实验步骤富文本 · 懒加载</text>
      <rect x="52" y="236" width="190" height="56" rx="10" fill="#fff" stroke="#bfdbfe"/>
      <text x="66" y="260" font-weight="700">React Flow + dagre</text><text x="66" y="280" font-size="11.5" fill="#64748b">附件节点图 · 懒加载</text>
      <rect x="252" y="236" width="190" height="56" rx="10" fill="#fff" stroke="#bfdbfe"/>
      <text x="266" y="260" font-weight="700">报告与导出</text><text x="266" y="280" font-size="11.5" fill="#64748b">PDF · DOCX · XLSX · CDXML</text>
      <rect x="52" y="318" width="390" height="60" rx="10" fill="#fff" stroke="#93c5fd" stroke-dasharray="5 4"/>
      <text x="66" y="343" font-weight="700">存储层 storage/</text>
      <text x="66" y="364" font-size="11.5" fill="#64748b">/api/health 可用 → 服务器 (apiRepo)；否则 → localStorage</text>
    </g>
    <!-- Cloudflare -->
    <rect x="560" y="32" width="368" height="246" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="580" y="64" font-size="17" font-weight="700" fill="#9a3412">Cloudflare Worker</text>
    <text x="580" y="86" font-size="12" fill="#ea580c">worker/ · wrangler.toml</text>
    <g font-size="13" fill="#0f172a">
      <rect x="580" y="104" width="160" height="56" rx="10" fill="#fff" stroke="#fed7aa"/>
      <text x="594" y="128" font-weight="700">静态资源</text><text x="594" y="148" font-size="11.5" fill="#64748b">dist/（网页）</text>
      <rect x="750" y="104" width="160" height="56" rx="10" fill="#fff" stroke="#fed7aa"/>
      <text x="764" y="128" font-weight="700">/api/*</text><text x="764" y="148" font-size="11.5" fill="#64748b">反应 · 缩写 · 试剂 · 附件</text>
      <rect x="580" y="196" width="160" height="62" rx="10" fill="#fff" stroke="#fed7aa"/>
      <text x="594" y="221" font-weight="700">D1 (SQLite)</text><text x="594" y="242" font-size="11.5" fill="#64748b">数据 · 版本 · 节点图</text>
      <rect x="750" y="196" width="160" height="62" rx="10" fill="#fff" stroke="#fed7aa"/>
      <text x="764" y="221" font-weight="700">R2</text><text x="764" y="242" font-size="11.5" fill="#64748b">谱图与附件文件</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)">
      <path d="M800 160 690 194"/><path d="M830 160v34"/>
    </g>
    <!-- External -->
    <rect x="560" y="306" width="368" height="92" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="580" y="336" font-size="17" font-weight="700" fill="#166534">外部公共接口</text>
    <g font-size="13" fill="#0f172a">
      <text x="580" y="362"><tspan font-weight="700">PubChem</tspan><tspan fill="#64748b" font-size="11.5">  性质 · 密度 · GHS</tspan></text>
      <text x="580" y="384"><tspan font-weight="700">Crossref</tspan><tspan fill="#64748b" font-size="11.5">  DOI 文献信息</tspan></text>
    </g>
    <!-- Links -->
    <g fill="none" stroke="#64748b" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)">
      <path d="M442 336h70V16h318v86"/>
      <path d="M442 364h116"/>
    </g>
    <g font-size="11.5" fill="#475569">
      <text x="518" y="230">fetch</text><text x="518" y="246">/api/*</text>
      <text x="470" y="384">fetch</text>
    </g>
  </g>
</svg>
